name: Debug V4.3 patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  debug:
    if: github.head_ref == 'fix/v4-3-numeric-pin-terms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-3-numeric-pin-terms
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-v4-3-numeric-pin-terms.yml').read_text(encoding='utf-8').splitlines()
          output = []
          inside = False
          for line in source:
              if "python - <<'PY'" in line:
                  inside = True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  output.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_v4_3.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
      - name: Run patch and capture output
        continue-on-error: true
        run: |
          python /tmp/apply_v4_3.py > PATCH_OUTPUT.txt 2>&1
          echo "exit_code=$?" >> PATCH_OUTPUT.txt
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PATCH_OUTPUT.txt
          git commit -m "Capture V4.3 patch diagnostics" || exit 0
          git push origin HEAD:fix/v4-3-numeric-pin-terms
