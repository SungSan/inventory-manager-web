name: Validate V4.3.1

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    if: github.head_ref == 'fix/v4-3-1-work-request-document-print'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
