name: Run V4.3 patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/v4-3-numeric-pin-terms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-3-numeric-pin-terms
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize source for deterministic patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/components/scan-workflow-v4.tsx')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^\s*const insufficient = operation === "OB" && Boolean\(productLocation\) && item\.qty > stock;$',
              '                    const insufficient = operation === "OB" && Boolean(productLocation) && item.qty > stock;',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit(f'insufficient line normalization failed: {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Extract and run patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-v4-3-numeric-pin-terms.yml').read_text(encoding='utf-8').splitlines()
          output = []
          inside = False
          for line in source:
              if "python - <<'PY'" in line:
                  inside = True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  output.append(line[10:] if line.startswith('          ') else line)
          if not output:
              raise SystemExit('embedded patch script not found')
          Path('/tmp/apply_v4_3.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_v4_3.py
      - name: Apply TypeScript corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          corrections = {
            'src/app/transfers/[id]/page.tsx': [
              ('Object.values(drafts).reduce((sum, qty) => sum + numberOrZero(qty), 0)', 'Object.values(drafts).reduce<number>((sum, qty) => sum + numberOrZero(qty), 0)'),
            ],
            'src/components/scan-workflow-v4.tsx': [
              ('Object.values(selectedItems).reduce((sum, qty) => sum + numberOrZero(qty), 0)', 'Object.values(selectedItems).reduce<number>((sum, qty) => sum + numberOrZero(qty), 0)'),
            ],
            'src/components/external-transfer-detail-v2.tsx': [
              ('Object.values(allocationDraft[item.productId] ?? {})\n      .reduce((sum, qty) => sum + numberOrZero(qty), 0)', 'Object.values(allocationDraft[item.productId] ?? {})\n      .reduce<number>((sum, qty) => sum + numberOrZero(qty), 0)'),
            ],
          }
          for file_name, replacements in corrections.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'correction not found in {file_name}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json public/sw.js
          git commit -m "V4.3.0: allow blank numeric inputs and clarify PIN terms"
          git push origin HEAD:fix/v4-3-numeric-pin-terms
