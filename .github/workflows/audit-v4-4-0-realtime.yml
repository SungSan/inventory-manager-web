name: Audit V4.4.0 realtime usage

on:
  push:
    branches: [fix/v4-4-0-realtime-performance]
  pull_request:
    branches: [main]

jobs:
  audit:
    if: github.head_ref == 'fix/v4-4-0-realtime-performance' || github.ref_name == 'fix/v4-4-0-realtime-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find realtime subscriptions and database tables
        run: |
          {
            echo '=== subscribeToInventory usages ==='
            grep -RIn --exclude-dir=node_modules --exclude='*.map' 'subscribeToInventory' src || true
            echo '=== postgres_changes usages ==='
            grep -RIn --exclude-dir=node_modules --exclude='*.map' 'postgres_changes' src || true
            echo '=== setInterval usages ==='
            grep -RIn --exclude-dir=node_modules --exclude='*.map' 'setInterval' src || true
            echo '=== full inventory loads ==='
            grep -RIn --exclude-dir=node_modules --exclude='*.map' 'listAllInventoryRows' src || true
            echo '=== database tables declared in migrations ==='
            grep -RInE 'create table( if not exists)? public\.' supabase || true
            echo '=== direct table reads in src ==='
            grep -RInE '\.from\("[a-zA-Z0-9_]+"\)' src || true
          } > realtime-audit.txt
          cat realtime-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: realtime-audit
          path: realtime-audit.txt
