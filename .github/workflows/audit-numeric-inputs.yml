name: Audit numeric inputs

on:
  push:
    branches: [fix/v4-3-numeric-pin-terms]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-3-numeric-pin-terms
      - name: Build numeric input audit
        run: |
          {
            echo '# type=number occurrences'
            grep -RIn --include='*.tsx' --include='*.ts' 'type="number"' src || true
            echo
            echo '# Number(event.target.value) occurrences'
            grep -RIn --include='*.tsx' --include='*.ts' 'Number(event.target.value)' src || true
            echo
            echo '# Math.max(1 occurrences'
            grep -RIn --include='*.tsx' --include='*.ts' 'Math.max(1' src || true
            echo
            echo '# parseInt occurrences'
            grep -RIn --include='*.tsx' --include='*.ts' 'parseInt' src || true
          } > NUMERIC_INPUT_AUDIT.txt
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NUMERIC_INPUT_AUDIT.txt
          git commit -m "Audit numeric input handling" || exit 0
          git push origin HEAD:fix/v4-3-numeric-pin-terms
