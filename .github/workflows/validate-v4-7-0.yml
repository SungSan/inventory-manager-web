name: Validate V4.7.0
on:
  push:
    branches:
      - feat/v4-7-0-benefit-automation
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          exit $code
      - name: Build
        if: success()
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          exit $code
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-7-0-validation-logs
          path: |
            typecheck.log
            build.log
          if-no-files-found: ignore
