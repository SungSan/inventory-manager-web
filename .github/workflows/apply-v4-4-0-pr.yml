name: Apply V4.4.0 performance patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/v4-4-0-realtime-performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4-4-0-realtime-performance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python scripts/apply_v4_4_0.py
      - name: Validate application
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          if grep -RIn --exclude-dir=node_modules '{ event: "*", schema: "public" }' src; then
            echo 'Unfiltered public realtime subscription remains.'
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules 'setInterval.*200' src/components/scan-workflow-v5.tsx; then
            echo '200ms scan UI polling remains.'
            exit 1
          fi
      - name: Validate PostgreSQL syntax
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          parse_sql(Path('supabase/27_REALTIME_PERFORMANCE_INDEXES.sql').read_text(encoding='utf-8'))
          print('PostgreSQL syntax OK')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- src package.json public/sw.js supabase/27_REALTIME_PERFORMANCE_INDEXES.sql; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json public/sw.js supabase/27_REALTIME_PERFORMANCE_INDEXES.sql
          if git diff --cached --quiet; then
            echo "No staged source changes"
            exit 0
          fi
          git commit -m "Optimize realtime updates for concurrent warehouse work"
          git push origin HEAD:fix/v4-4-0-realtime-performance
