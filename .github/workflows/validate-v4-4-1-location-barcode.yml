name: Validate V4.4.1 location barcode correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test LOC barcode normalization
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {
            containsHangul,
            convertHangulToQwerty,
            isValidLocationBarcodeFormat,
            normalizeLocationBarcodeInput,
          } from "./src/lib/location-barcode.ts";

          const cases = [
            ["ㅇ1ㅁ010101", "D1A-01-01-01"],
            ["D1A010101", "D1A-01-01-01"],
            ["d1a010101", "D1A-01-01-01"],
            ["D1A-01-01-01", "D1A-01-01-01"],
            ["  D1A010101\r\n", "D1A-01-01-01"],
            ["ㅏ1ㅁ010101", "K1A-01-01-01"],
          ];
          for (const [input, expected] of cases) {
            assert.equal(normalizeLocationBarcodeInput(input), expected, input);
          }
          assert.equal(convertHangulToQwerty("ㅇ1ㅁ010101"), "d1a010101");
          assert.equal(containsHangul("ㅇ1ㅁ010101"), true);
          assert.equal(containsHangul("D1A010101"), false);
          assert.equal(isValidLocationBarcodeFormat("ㅇ1ㅁ010101"), true);
          assert.equal(normalizeLocationBarcodeInput("8801234567890"), "8801234567890");
          assert.equal(normalizeLocationBarcodeInput("PRODUCT-ABC"), "PRODUCT-ABC");
          console.log("LOC barcode normalization tests passed");
          NODE
      - name: Verify LOC-only integration guards
        run: |
          python - <<'PY'
          from pathlib import Path

          field = Path("src/components/barcode-field.tsx").read_text(encoding="utf-8")
          transfer = Path("src/lib/transfer-api.ts").read_text(encoding="utf-8")
          locations = Path("src/app/locations/page.tsx").read_text(encoding="utf-8")

          required = [
              'inputKind === "location"',
              'inputKind === "mixed" && containsHangul(raw)',
              'isValidLocationBarcodeFormat(locationCandidate)',
              'listLocations(locationCandidate, false)',
              'return raw.trim()',
              'onCompositionEnd',
              'pendingEnterRef',
              'submittingRef',
          ]
          for token in required:
              assert token in field, f"missing BarcodeField guard: {token}"
          assert 'p_source_barcode: normalizeLocationBarcodeInput(sourceBarcode)' in transfer
          assert 'p_destination_barcode: normalizeLocationBarcodeInput(destinationBarcode)' in transfer
          assert 'normalizeStandardLocationOrKeep' in locations
          print("LOC-only integration guards passed")
          PY
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
